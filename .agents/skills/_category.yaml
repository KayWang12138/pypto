name: skills
description: "Flat PyPTO skill catalog. All skills for kernel development, debugging, performance tuning, CI/PR, pass analysis, orchestration, and workflow phases live directly under .agents/skills/."

# Organized by logical category for readability. All skills are siblings on disk
# under .agents/skills/<skill-id>/ — the `category` field below is metadata only.
#
# scope legend (ci-and-pr only):
#   in-phase : used during Phase 3-5 gates (Verification Agent loads directly)
#   post-dev : loaded only after GATE 4 by the Lead Agent, on specific trigger

categories:
  - name: ci-and-pr
    description: "Layout validation, PR creation/fix, Issue management, quality review."
  - name: debugging
    description: "Precision debugging, error localization, memory analysis, crash investigation."
  - name: development
    description: "Requirements analysis, API exploration, golden reference, design, implementation."
  - name: orchestration
    description: "Cross-cutting orchestration skills. The Lead Agent reads skills in this category to run the entire PyPTO kernel-development workflow."
  - name: pass
    description: "Pass module analysis, error diagnosis, compilation performance, UT generation."
  - name: performance
    description: "3-stage performance tuning: frontend, swimlane, incore optimization."
  - name: workflow
    description: "Phase orchestration (0-6), code format templates, plan template, and validation."

skills:
  # ---------- ci-and-pr ----------
  - id: ci-and-layout-check
    category: ci-and-pr
    scope: in-phase
    description: "Layout validator, extract_pypto_calls, run_validate_layout.sh."
    triggers: ["layout check", "CI check", "validate layout", "extract calls"]
  - id: pypto-pr-creator
    category: ci-and-pr
    scope: post-dev
    description: "Create PR to cann/pypto with fork validation and commit conventions."
    triggers: ["create PR", "submit code", "push to remote", "pull request"]
  - id: pypto-pr-fixer
    category: ci-and-pr
    scope: post-dev
    description: "Fix CodeCheck CI failures and address reviewer comments."
    triggers: ["fix PR", "CodeCheck", "CI failure", "review comment"]
  - id: pypto-issue-creator
    category: ci-and-pr
    scope: post-dev
    description: "Create GitCode Issue (bug, feature, doc, question, task)."
    triggers: ["create issue", "report bug", "feature request", "GitCode issue"]
  - id: pypto-fracture-point-detector
    category: ci-and-pr
    scope: post-dev
    description: "Identify framework/documentation gaps from session context."
    triggers: ["fracture point", "documentation gap", "framework issue"]
  - id: pypto-skill-reviewer
    category: ci-and-pr
    scope: post-dev
    description: "Audit skill directory for quality and best-practice compliance."
    triggers: ["skill review", "skill audit", "quality check", "compliance"]

  # ---------- debugging ----------
  - id: debugging
    category: debugging
    description: "Failure logging, strategy switching, op-by-op check protocol, DEBUG.md."
    triggers: ["compile error", "runtime error", "stuck", "debug protocol"]
  - id: pypto-precision-debug
    category: debugging
    description: "Code-level precision workaround checklist (inplace, unroll, +0.0)."
    triggers: ["precision failure", "accuracy mismatch", "numerical deviation"]
  - id: pypto-precision-compare
    category: debugging
    description: "Precision bisection via pass_verify_save or checkpoint tensors."
    triggers: ["precision bisection", "binary search", "pass_verify_save"]
  - id: pypto-aicore-error-locator
    category: debugging
    description: "Locate CCE file and problem line for aicore errors."
    triggers: ["aicore error", "CCE file", "device error"]
  - id: pypto-host-stacktrace-analyzer
    category: debugging
    description: "Host-side crash stack trace analysis, address-to-source mapping."
    triggers: ["stack trace", "crash", "backtrace", "segfault"]
  - id: pypto-memory-overlap-detector
    category: debugging
    description: "Detect workspace memory overlap causing precision issues."
    triggers: ["memory overlap", "workspace conflict", "memory corruption"]
  - id: pypto-machine-workspace
    category: debugging
    description: "Diagnose abnormally large workspace memory, locate oversized tensors."
    triggers: ["workspace memory", "out of memory", "OOM", "rtMalloc failed"]
  - id: pypto-tile-shape-debug
    category: debugging
    description: "Tile shape / L0A/L0B/L0C/L1 size and alignment debugging."
    triggers: ["tile shape", "L0A", "L0B", "L0C", "L1 size", "tile align", "enable_split_k"]

  # ---------- development ----------
  - id: pypto-environment-setup
    category: development
    description: "CANN/torch_npu/build environment setup and repair."
    triggers: ["environment setup", "CANN install", "torch_npu", "NPU driver", "build error"]
  - id: pypto-intent-understand
    category: development
    description: "Convert natural-language operator requirements to structured SPEC.md."
    triggers: ["requirements", "intent", "SPEC", "operator description"]
  - id: pypto-api-explore
    category: development
    description: "API availability check, constraint verification, API_REPORT.md."
    triggers: ["API explore", "API mapping", "constraint check", "feasibility"]
  - id: pypto-golden-generate
    category: development
    description: "Generate PyTorch golden reference with confidence scoring."
    triggers: ["golden", "reference implementation", "golden.py", "baseline"]
  - id: pypto-op-design
    category: development
    description: "Generate DESIGN.md with API mapping, tiling strategy, loop structure."
    triggers: ["design", "DESIGN.md", "tiling strategy", "loop structure"]
  - id: pypto-op-develop
    category: development
    description: "Generate impl.py, test.py, README with execution constraints."
    triggers: ["implement", "develop", "impl.py", "test.py", "kernel code"]
  - id: pypto-op-workflow
    category: development
    description: "Overall operator development workflow reference."
    triggers: ["workflow", "development flow", "full process"]
  - id: pypto-fused-op-integration
    category: development
    description: "Integrate fused operator into model, replacing small-op combinations."
    triggers: ["fused op", "model integration", "replace small ops", "end-to-end"]

  # ---------- orchestration ----------
  - id: lead-orchestrator
    category: orchestration
    description: "Lead Agent entry point. Bundles the 5 control documents (principles, agent plan, team roster, mandatory rules, routing catalog) as a single skill with progressive-disclosure references."
    triggers: ["lead agent", "orchestrator", "team dispatch", "start kernel development", "phase orchestration", "gate enforcement"]

  # ---------- pass ----------
  - id: pypto-pass-error-locator
    category: pass
    description: "Pass module error diagnosis: localization, cause analysis, fix suggestions."
    triggers: ["pass error", "pass diagnosis", "pass module error"]
  - id: pypto-pass-module-analyzer
    category: pass
    description: "Analyze pass source code, generate module analysis documentation."
    triggers: ["pass analysis", "module analysis", "pass code review"]
  - id: pypto-pass-perf-optimizer
    category: pass
    description: "Measure and optimize pass compilation performance."
    triggers: ["pass performance", "compilation time", "pass optimization"]
  - id: pypto-pass-ut-generate
    category: pass
    description: "Generate unit tests for pass modules from business descriptions."
    triggers: ["pass UT", "unit test", "pass test generation"]
  - id: pypto-pass-workflow-analyzer
    category: pass
    description: "Analyze pass workflow: execution order, dependencies, data flow."
    triggers: ["pass workflow", "execution flow", "data flow", "pass sequence"]

  # ---------- performance ----------
  - id: pypto-op-perf-tune
    category: performance
    description: "Performance analysis and tuning orchestrator (3-stage workflow)."
    triggers: ["performance tuning", "perf analysis", "auto tune", "optimize kernel"]
  - id: perf-analyzer
    category: performance
    description: "Extract performance metrics, compute ratings, identify bottlenecks."
    triggers: ["perf metrics", "performance report", "bottleneck analysis"]
  - id: tune-frontend
    category: performance
    description: "Frontend code-level tuning: loop patterns, TileShape, data ops."
    triggers: ["frontend tuning", "loop optimization", "TileShape", "code-level perf"]
  - id: tune-incore
    category: performance
    description: "Single-task instruction-level and incore pipeline optimization."
    triggers: ["incore tuning", "instruction optimization", "single task", "pipeline"]
  - id: tune-swimlane
    category: performance
    description: "Swimlane diagram analysis: Stitch, graph fusion, scheduling."
    triggers: ["swimlane", "Stitch", "graph fusion", "scheduling optimization"]
  - id: pypto-operator-auto-tuner
    category: performance
    description: "Automation scripts for swimlane extraction and AIV dep chains."
    triggers: ["auto tuner", "swimlane script", "AIV dependency", "leafhash"]

  # ---------- workflow ----------
  - id: phase0-phase1-planning
    category: workflow
    description: "Phase 0 triage, API availability, Phase 1 golden preparation and freeze."
    triggers: ["phase 0", "phase 1", "API check", "golden preparation", "plan file"]
  - id: phase2-phase3-construction
    category: workflow
    description: "Module decomposition, one-at-a-time construction, DEBUG §9 lookup."
    triggers: ["phase 2", "phase 3", "module decomposition", "module construction"]
  - id: phase4-phase5-integration
    category: workflow
    description: "Progressive integration, structural rules (loops, tiles, write-back)."
    triggers: ["phase 4", "phase 5", "integration", "structural rules"]
  - id: phase6-optimization
    category: workflow
    description: "Config-level and algorithm-level optimization after correctness."
    triggers: ["phase 6", "optimization", "tuning", "performance"]
  - id: kernel-code-format
    category: workflow
    description: "Layers A-L design doc, naming conventions, pypto_kernel_template.py."
    triggers: ["code format", "template", "layers A-L", "naming convention"]
  - id: plan-template
    category: workflow
    description: "Plan template for custom/plan/<op>.md with required sections."
    triggers: ["plan template", "plan file", "custom/plan"]
  - id: validation-and-deliverables
    category: workflow
    description: "Validation runner, detailed_tensor_compare, success criteria."
    triggers: ["validation", "test runner", "detailed_tensor_compare", "deliverables"]
