# pypto KernelBench 批处理默认配置
# 所有字段都可被 CLI 覆盖.

# --- 数据集 (上游 KernelBench, PyTorch 原版) ---
# 来源: https://github.com/ScalingIntelligence/KernelBench.git
# 固定 commit: 21fbe5a642898cd60b8f60c7aefb43d475e11f33
# 下载: bash pypto/integration/benchmark/scripts/download_kernelbench.sh
# bench_dir 指 KernelBench/KernelBench/ (含 level1 / level2 / level3 子目录).
# 留空则 CLI 自动 fallback 到桥接层 .cache/KernelBench/KernelBench/.
bench_dir: ""

# 默认 KernelBench 难度: level1 / level2 / level3.
level: "level1"

# --- 设备 ---
# 用于 pypto 生成 + KernelVerifier 验证的 NPU 卡列表.
# 单卡 sequential 时填 [0] 即可.
devices: [0]

# --- 并发 ---
# 同时跑的 case 数, 上限不应超过 len(devices).
concurrency: 1

# --- pypto 工作流 ---
pypto:
  # opencode CLI 可执行路径; 留空则按 PATH 查找.
  opencode_bin: ""
  # 显式传给 opencode run -m 的模型名; 留空则沿用 opencode 当前默认配置.
  opencode_model: ""
  # 调用的 agent 名 (须在 pypto/.opencode/agents/ 下注册).
  agent: "pypto-op-orchestrator"
  # 单 case 工作流超时, 秒. 7 阶段实跑可能很慢, 默认 120 min 覆盖 Stage 7
  # 性能调优 10 轮迭代; 单纯 correctness 实验可显式调小.
  timeout_sec: 7200
  # 是否跳过 Stage 7 的迭代性能调优. true 时仅做 Stage 7 收尾, 不跑 perf-tune 循环.
  skip_stage7_perf_tune: false
  # 失败重试次数 (子进程级, 不是 stage 级).
  retries: 0
  # 算子产物落地的根目录 (相对 pypto 仓根); 形成 custom/{op}/.
  workdir_root: "custom"
  # opencode --format; default 输出可读, json 输出结构化事件流.
  output_format: "default"

# --- 验证 ---
verifier:
  # ascend910b1 / ascend910b2 / ascend910b4 等.
  arch: "ascend910b4"
  # 框架: torch (内置 verifier 仅支持 torch).
  framework: "torch"
  # 单次 verify 子进程超时, 秒. 默认 15 分钟.
  verify_timeout: 900
  # verify 精度比较容差; 留空则走代码默认值 1e-3 / 1e-3.
  # verify_rtol: 1.0e-3
  # verify_atol: 1.0e-3
  # 验证范围:
  #   correctness  — 仅精度
  #   performance  — 精度 + 性能 (gen vs base speedup)
  #   full         — 当前等价于 performance
  mode: "correctness"
  # 执行模式 (谁来跑反作弊+精度+性能):
  #   opencode — spawn `opencode run --agent pypto-kernel-validator` 加载
  #              `.opencode/skills/pypto-kernel-validate`, agent 在 skill
  #              引导下做"脚本机械检测 + LLM 语义审阅 + 精度 + 性能",
  #              落 skill_report.json. 这是默认 + 对外贡献候选物.
  #   direct   — 直调内置 KernelVerifier, 跳过 LLM 语义层 (无反作弊审阅).
  #              仅用于 CI / 离线 dev 调试, 节省 LLM 调用成本.
  verifier_mode: "opencode"
  # opencode 模式 — agent 名 (须在 .opencode/agents/ 下注册).
  validator_agent: "pypto-kernel-validator"
  # opencode 模式 — skill agent 子进程硬超时, 秒.
  skill_timeout_sec: 1800
  # opencode/API 层超时后的重试次数; 业务验证失败不重试.
  skill_retry: 2
  # opencode/API 层超时重试间隔, 秒.
  skill_retry_interval_sec: 600
  # KernelVerifier 工作目录根.
  log_dir: "~/pypto_bench_logs"
  # 是否保留 KernelVerifier verify/profile 临时工作目录.
  # 默认 false: 子进程日志已进入报告/JSON 摘要后清理脚本和源码副本.
  # 调试 verify/profile 脚本时可设为 true, 或 CLI 传 --keep-verifier-artifacts.
  keep_artifacts: false

# --- 报告 ---
report:
  # 报告输出根目录 (相对运行目录).
  out_dir: "benchmark_report"
