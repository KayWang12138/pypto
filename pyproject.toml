[build-system]
requires = [
"scikit-build-core>=0.11.6",
"pybind11>=2.0.1",
"torch>=2.1.0",
"torch_npu>=2.1.0",
"numpy",
"sympy",
]
build-backend = "scikit_build_core.build"

[project]
name = "pto"
version = "1.0.0"
description = "PTO"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

[tool.scikit-build]
wheel.packages = ["python/pto/"]
build-dir = "build"

[tool.scikit-build.cmake.define]
ENABLE_FEATURE_PYTHON_FRONT_END = "ON"
