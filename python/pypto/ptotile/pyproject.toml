[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptodsl"
version = "0.1.0"
description = "High-level DSL for PTO MLIR, mapping to low-level mlir.ir / mlir.dialects"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = [".."]
include = ["ptodsl*"]